<div class="card">
  <h1>Workout Coach</h1>

  @if (facade.currentExercise(); as exercise) {
    <app-workout-timer
      [exerciseName]="exercise.name"
      [exercisePosition]="facade.exercisePosition()"
      [exerciseTotal]="facade.exerciseTotal()"
      [phase]="facade.phase()"
      [secondsRemaining]="facade.secondsRemaining()"
      [completedRepetitions]="facade.completedRepetitions()"
      [repetitionsNumber]="exercise.repetitionsNumber"
      [isRunning]="facade.isRunning()"
      (start)="facade.start()"
      (pause)="facade.pause()"
      (reset)="facade.reset()"
    />
  }

  <app-workout-toast [message]="facade.toastMessage()" />

  <app-exercise-list
    [exercises]="facade.exercises()"
    [statuses]="facade.statuses()"
    [currentIndex]="facade.currentExerciseIndex()"
  />
</div>
