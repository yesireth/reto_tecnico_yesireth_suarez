<div class="card">
  <h1>Workout Coach</h1>

  @if (facade.currentExercise(); as exercise) {
    <app-workout-timer
      [exerciseName]="exercise.name"
      [exercisePosition]="facade.session().currentExerciseIndex + 1"
      [exerciseTotal]="facade.session().exercises.length"
      [phase]="facade.phase()"
      [secondsRemaining]="facade.session().secondsRemaining"
      [completedRepetitions]="facade.session().completedRepetitions"
      [repetitionsNumber]="exercise.repetitionsNumber"
      [isRunning]="facade.isRunning()"
      (start)="facade.start()"
      (pause)="facade.pause()"
      (reset)="facade.reset()"
    />
  }

  <app-workout-toast [message]="facade.toastMessage()" />

  <app-exercise-list
    [exercises]="facade.session().exercises"
    [statuses]="facade.session().statuses"
    [currentIndex]="facade.session().currentExerciseIndex"
  />
</div>
